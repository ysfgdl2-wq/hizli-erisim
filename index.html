<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hızlı Erişim</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;font-family:Arial,sans-serif;color:white;
display:flex;align-items:center;justify-content:center;padding:25px;
background:radial-gradient(circle at top left,#334155,transparent 35%),
radial-gradient(circle at bottom right,#1e3a8a,transparent 35%),#020617
}
.container{width:100%;max-width:430px;text-align:center}
.logo{
width:78px;height:78px;margin:0 auto 22px;border-radius:24px;
display:flex;align-items:center;justify-content:center;font-size:35px;
background:#ffffff18;border:1px solid #ffffff26
}
h1{font-size:30px;margin-bottom:10px}
.description{color:#cbd5e1;font-size:15px;line-height:1.6;margin-bottom:30px}
.buttons{display:flex;flex-direction:column;gap:16px}
.button{
display:flex;align-items:center;padding:18px 20px;border-radius:18px;
color:white;text-decoration:none;font-size:16px;font-weight:bold;
border:1px solid #ffffff20;box-shadow:0 10px 30px #00000040;
transition:.25s
}
.button:hover{transform:translateY(-3px)}
.icon{
width:46px;height:46px;border-radius:14px;display:flex;
align-items:center;justify-content:center;font-size:22px;margin-right:15px
}
.kandilli{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.mynet{background:linear-gradient(135deg,#f97316,#ea580c)}
.icon{background:#ffffff25}
.button-text{text-align:left;flex:1}
.button-subtitle{display:block;font-size:12px;font-weight:normal;opacity:.75;margin-top:3px}
.arrow{font-size:25px;opacity:.7}
.footer{margin-top:30px;font-size:12px;color:#64748b}
</style>
</head>

<body>
<main class="container">

<div class="logo">🔗</div>

<h1>Hızlı Erişim</h1>

<p class="description">
İhtiyacınız olan bağlantıya aşağıdaki butonlardan hızlıca ulaşabilirsiniz.
</p>

<div class="buttons">

<a class="button kandilli"
href="http://www.koeri.boun.edu.tr/scripts/lst1.asp"
target="_blank">
<div class="icon">🌍</div>
<div class="button-text">
Kandilli Rasathanesi
<span class="button-subtitle">Son deprem bilgilerini görüntüle</span>
</div>
<span class="arrow">›</span>
</a>

<a class="button mynet"
href="https://www.mynet.com/"
target="_blank">
<div class="icon">📰</div>
<div class="button-text">
Mynet
<span class="button-subtitle">Mynet'e git</span>
</div>
<span class="arrow">›</span>
</a>

</div>

<div class="footer">Hızlı ve kolay erişim</div>

</main>
</body>
</html>
